AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OSHA Interpretations Scraper using Crawlee
Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage
  MongoDbUri:
    Type: String
    Description: MongoDB connection URI
  MongoDbName:
    Type: String
    Default: mancomm
    Description: MongoDB database name
  MaxInterpretations:
    Type: Number
    Default: 100
    Description: Maximum number of interpretations to process per run
Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Runtime: nodejs18.x
    Environment:
      Variables:
        MONGODB_URI:
          Ref: MongoDbUri
        MONGODB_NAME:
          Ref: MongoDbName
        MAX_INTERPRETATIONS:
          Ref: MaxInterpretations
Resources:
  OshaScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-osha-scraper-${Stage}
      CodeUri: OshaScraperFunction
      Handler: handlers/scraper.handler
      Timeout: 900
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name:
              Fn::Sub: ${AWS::StackName}-hourly-scraper-${Stage}
            Description: Runs OSHA interpretations scraper every hour
            Enabled: true
    Metadata:
      SamResourceId: OshaScraperFunction
Outputs:
  OshaScraperFunction:
    Description: OSHA Interpretations Scraper Lambda Function ARN
    Value:
      Fn::GetAtt:
      - OshaScraperFunction
      - Arn
  OshaScraperFunctionRole:
    Description: Implicit IAM Role created for the function
    Value:
      Fn::GetAtt:
      - OshaScraperFunctionRole
      - Arn
